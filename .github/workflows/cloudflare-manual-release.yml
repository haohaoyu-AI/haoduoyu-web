name: Manual Cloudflare production release
on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: Exact accepted source commit (production restore or historical release)
        required: true
        type: choice
        default: fcd8185cfc8f134db75280ad54d2645cd061ecf8
        options:
          - fcd8185cfc8f134db75280ad54d2645cd061ecf8
          - b35dd510aec0fe67a88aa02edabcd73bfda9b33f
          - 2627fc1f52e426169a5c8bc9939c5d74e8c7a24d
          - 947bc782ea70e7808f6e7de523e5977818b292df
          - 16ff80ef2d857676d81b7c219110c820de5af72b
      expected_current_version:
        description: Re-read current 100% production version UUID before dispatch
        required: true
        type: string
      local_upload_stopped:
        description: Local uploads stopped and every uncertain result reconciled
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: haoduoyu-cloudflare-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-production
    env:
      TARGET_COMMIT: ${{ inputs.target_commit }}
      EXPECTED_CURRENT_VERSION: ${{ inputs.expected_current_version }}
      LOCAL_UPLOAD_STOPPED: ${{ inputs.local_upload_stopped }}
    steps:
      - name: Checkout release controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Scan all fetched history before using production credentials
        uses: ./.github/actions/gitleaks
      - name: Verify exact release eligibility
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-policy.mjs verify
      - name: Checkout accepted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.release.outputs.target_commit }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Install locked build dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build accepted Worker without migrations or deployment
        working-directory: source
        run: npm run build
      - name: Verify restored source artifacts
        if: inputs.target_commit == 'b35dd510aec0fe67a88aa02edabcd73bfda9b33f' || inputs.target_commit == '2627fc1f52e426169a5c8bc9939c5d74e8c7a24d' || inputs.target_commit == 'fcd8185cfc8f134db75280ad54d2645cd061ecf8'
        working-directory: source
        run: npm run check:artifacts
      - name: Verify safe Markdown for reports and daily reminders
        if: inputs.target_commit == 'b35dd510aec0fe67a88aa02edabcd73bfda9b33f' || inputs.target_commit == '2627fc1f52e426169a5c8bc9939c5d74e8c7a24d' || inputs.target_commit == 'fcd8185cfc8f134db75280ad54d2645cd061ecf8'
        working-directory: source
        run: node --test tests/ai-report-markdown.test.mjs tests/ai-reports-navigation.test.mjs tests/ai-reminder-markdown.test.mjs
      - name: Verify update recovery and draft preservation
        if: inputs.target_commit == 'b35dd510aec0fe67a88aa02edabcd73bfda9b33f' || inputs.target_commit == '2627fc1f52e426169a5c8bc9939c5d74e8c7a24d' || inputs.target_commit == 'fcd8185cfc8f134db75280ad54d2645cd061ecf8'
        working-directory: source
        run: node --test tests/sw-update-recovery.test.mjs tests/unify-service-worker.test.mjs tests/unify-memo-controller-refresh.test.mjs
      - name: Verify AI report author colors
        if: inputs.target_commit == 'b35dd510aec0fe67a88aa02edabcd73bfda9b33f' || inputs.target_commit == '2627fc1f52e426169a5c8bc9939c5d74e8c7a24d' || inputs.target_commit == 'fcd8185cfc8f134db75280ad54d2645cd061ecf8'
        working-directory: source
        run: node --test tests/ai-report-author-colors.test.mjs
      - name: Verify mobile navigation cleanup
        if: inputs.target_commit == 'b35dd510aec0fe67a88aa02edabcd73bfda9b33f' || inputs.target_commit == '2627fc1f52e426169a5c8bc9939c5d74e8c7a24d' || inputs.target_commit == 'fcd8185cfc8f134db75280ad54d2645cd061ecf8'
        working-directory: source
        run: node --test --test-name-pattern='phone bottom navigation|mobile-only stylesheet' tests/unify-mobile.test.mjs
      - name: Verify compact phone calendar layout and navigation
        if: inputs.target_commit == 'b35dd510aec0fe67a88aa02edabcd73bfda9b33f' || inputs.target_commit == '2627fc1f52e426169a5c8bc9939c5d74e8c7a24d' || inputs.target_commit == 'fcd8185cfc8f134db75280ad54d2645cd061ecf8'
        working-directory: source
        run: |
          node --test tests/mobile-calendar-layout.test.mjs
          node --test --test-name-pattern='compact phone calendar' tests/daily-todos-ui.test.mjs
      - name: Verify compact mobile article review
        if: inputs.target_commit == 'b35dd510aec0fe67a88aa02edabcd73bfda9b33f' || inputs.target_commit == 'fcd8185cfc8f134db75280ad54d2645cd061ecf8'
        working-directory: source
        run: node --test tests/mobile-review-layout.test.mjs tests/mobile-review-collapse.test.mjs
      - name: Verify OpenAI review and backup contracts without provider calls
        if: inputs.target_commit == 'fcd8185cfc8f134db75280ad54d2645cd061ecf8'
        working-directory: source
        run: node --test tests/openai-review.test.mjs tests/openai-review-ui.test.mjs tests/openai-review-migration-backup.test.mjs
      - name: Verify production release guards
        run: node --test tests/cloudflare-production-restore.test.mjs tests/cloudflare-publish.test.mjs
      - name: Verify accepted Worker bytes
        run: node .github/scripts/release-policy.mjs artifact
      - name: Publish existing Worker with inherited bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          WORKER_PATH: source/dist/server/index.js
          EXPECTED_WORKER_SHA256: ${{ steps.release.outputs.worker_sha256 }}
          EXPECTED_WORKER_BYTES: ${{ steps.release.outputs.worker_bytes }}
        run: node .github/scripts/cloudflare-publish.mjs
