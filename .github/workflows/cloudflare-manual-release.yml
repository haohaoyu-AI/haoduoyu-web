name: Manual Cloudflare production release
on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: Exact accepted source commit (pinned feature, restore or historical release)
        required: true
        type: choice
        default: 5044ed66af80f9593879453d23c88c3851a06f12
        options:
          # Exact source and Worker bytes verified before registration.
          - 3f4789dbe1994508ed89d15e472613e91b94fb87
          - 3528ad571af87b243f479611d4a049cb83ee1fa7
          - 75e2db9a05fd04cb873c1f41046a9ad14dfbf01e
          - ae90dc9148ce7d579714ad245f26d6829f1a556b
          - 58ac4a201e5a3a0e9107d077c3642997b09ece07
          - d715770a7753ea70931b330ce297fd566af6f0dd
          - bc8449887e6b88f11b05ccbed13613f2f34e9b57
          - e993885c752e97532214ef14a2fcf32b324bc08c
          - 52f5f32f29526b302e0f58bf3272f2d636f782a4
          - 334e00d676452cc47e044cb4f88f8209b1c411b0
          - 5044ed66af80f9593879453d23c88c3851a06f12
          - b35dd510aec0fe67a88aa02edabcd73bfda9b33f
          - 2627fc1f52e426169a5c8bc9939c5d74e8c7a24d
          - 947bc782ea70e7808f6e7de523e5977818b292df
          - 16ff80ef2d857676d81b7c219110c820de5af72b
      run_regression_tests:
        description: Optional functional regressions (off for fast release; production guards always run)
        required: false
        type: boolean
        default: false
      expected_current_version:
        description: Re-read current 100% production version UUID before dispatch
        required: true
        type: string
      local_upload_stopped:
        description: Local uploads stopped and every uncertain result reconciled
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: haoduoyu-cloudflare-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-production
    env:
      TARGET_COMMIT: ${{ inputs.target_commit }}
      EXPECTED_CURRENT_VERSION: ${{ inputs.expected_current_version }}
      LOCAL_UPLOAD_STOPPED: ${{ inputs.local_upload_stopped }}
    steps:
      - name: Checkout release controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Scan all fetched history before using production credentials
        uses: ./.github/actions/gitleaks
      - name: Verify exact release eligibility
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-policy.mjs verify
      - name: Checkout accepted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.release.outputs.target_commit }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Install locked build dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify committed data trends frontend before regeneration
        if: inputs.target_commit == '334e00d676452cc47e044cb4f88f8209b1c411b0' || inputs.target_commit == '52f5f32f29526b302e0f58bf3272f2d636f782a4' || inputs.target_commit == 'e993885c752e97532214ef14a2fcf32b324bc08c' || inputs.target_commit == 'bc8449887e6b88f11b05ccbed13613f2f34e9b57' || inputs.target_commit == 'd715770a7753ea70931b330ce297fd566af6f0dd'
        working-directory: source
        run: node scripts/frontend-build.mjs --check
      - name: Build accepted Worker without migrations or deployment
        working-directory: source
        run: npm run build
      - name: Verify restored source artifacts
        if: inputs.target_commit == 'b35dd510aec0fe67a88aa02edabcd73bfda9b33f' || inputs.target_commit == '2627fc1f52e426169a5c8bc9939c5d74e8c7a24d' || inputs.target_commit == '5044ed66af80f9593879453d23c88c3851a06f12' || inputs.target_commit == '334e00d676452cc47e044cb4f88f8209b1c411b0' || inputs.target_commit == '52f5f32f29526b302e0f58bf3272f2d636f782a4' || inputs.target_commit == 'e993885c752e97532214ef14a2fcf32b324bc08c' || inputs.target_commit == 'bc8449887e6b88f11b05ccbed13613f2f34e9b57' || inputs.target_commit == 'd715770a7753ea70931b330ce297fd566af6f0dd'
        working-directory: source
        run: npm run check:artifacts
      - name: Verify safe Markdown for reports and daily reminders
        if: inputs.run_regression_tests && (inputs.target_commit == 'b35dd510aec0fe67a88aa02edabcd73bfda9b33f' || inputs.target_commit == '2627fc1f52e426169a5c8bc9939c5d74e8c7a24d' || inputs.target_commit == '5044ed66af80f9593879453d23c88c3851a06f12' || inputs.target_commit == '334e00d676452cc47e044cb4f88f8209b1c411b0' || inputs.target_commit == '52f5f32f29526b302e0f58bf3272f2d636f782a4' || inputs.target_commit == 'e993885c752e97532214ef14a2fcf32b324bc08c' || inputs.target_commit == 'bc8449887e6b88f11b05ccbed13613f2f34e9b57' || inputs.target_commit == 'd715770a7753ea70931b330ce297fd566af6f0dd')
        working-directory: source
        run: node --test tests/ai-report-markdown.test.mjs tests/ai-reports-navigation.test.mjs tests/ai-reminder-markdown.test.mjs
      - name: Verify update recovery and draft preservation
        if: inputs.run_regression_tests && (inputs.target_commit == 'b35dd510aec0fe67a88aa02edabcd73bfda9b33f' || inputs.target_commit == '2627fc1f52e426169a5c8bc9939c5d74e8c7a24d' || inputs.target_commit == '5044ed66af80f9593879453d23c88c3851a06f12' || inputs.target_commit == '334e00d676452cc47e044cb4f88f8209b1c411b0' || inputs.target_commit == '52f5f32f29526b302e0f58bf3272f2d636f782a4' || inputs.target_commit == 'e993885c752e97532214ef14a2fcf32b324bc08c' || inputs.target_commit == 'bc8449887e6b88f11b05ccbed13613f2f34e9b57' || inputs.target_commit == 'd715770a7753ea70931b330ce297fd566af6f0dd')
        working-directory: source
        run: node --test tests/sw-update-recovery.test.mjs tests/unify-service-worker.test.mjs tests/unify-memo-controller-refresh.test.mjs
      - name: Verify AI report author colors
        if: inputs.run_regression_tests && (inputs.target_commit == 'b35dd510aec0fe67a88aa02edabcd73bfda9b33f' || inputs.target_commit == '2627fc1f52e426169a5c8bc9939c5d74e8c7a24d' || inputs.target_commit == '5044ed66af80f9593879453d23c88c3851a06f12' || inputs.target_commit == '334e00d676452cc47e044cb4f88f8209b1c411b0' || inputs.target_commit == '52f5f32f29526b302e0f58bf3272f2d636f782a4' || inputs.target_commit == 'e993885c752e97532214ef14a2fcf32b324bc08c' || inputs.target_commit == 'bc8449887e6b88f11b05ccbed13613f2f34e9b57' || inputs.target_commit == 'd715770a7753ea70931b330ce297fd566af6f0dd')
        working-directory: source
        run: node --test tests/ai-report-author-colors.test.mjs
      - name: Verify mobile navigation cleanup
        if: inputs.run_regression_tests && (inputs.target_commit == 'b35dd510aec0fe67a88aa02edabcd73bfda9b33f' || inputs.target_commit == '2627fc1f52e426169a5c8bc9939c5d74e8c7a24d' || inputs.target_commit == '5044ed66af80f9593879453d23c88c3851a06f12' || inputs.target_commit == '334e00d676452cc47e044cb4f88f8209b1c411b0' || inputs.target_commit == '52f5f32f29526b302e0f58bf3272f2d636f782a4' || inputs.target_commit == 'e993885c752e97532214ef14a2fcf32b324bc08c' || inputs.target_commit == 'bc8449887e6b88f11b05ccbed13613f2f34e9b57' || inputs.target_commit == 'd715770a7753ea70931b330ce297fd566af6f0dd')
        working-directory: source
        run: node --test --test-name-pattern='phone bottom navigation|mobile-only stylesheet' tests/unify-mobile.test.mjs
      - name: Verify compact phone calendar layout and navigation
        if: inputs.run_regression_tests && (inputs.target_commit == 'b35dd510aec0fe67a88aa02edabcd73bfda9b33f' || inputs.target_commit == '2627fc1f52e426169a5c8bc9939c5d74e8c7a24d' || inputs.target_commit == '5044ed66af80f9593879453d23c88c3851a06f12' || inputs.target_commit == '334e00d676452cc47e044cb4f88f8209b1c411b0' || inputs.target_commit == '52f5f32f29526b302e0f58bf3272f2d636f782a4' || inputs.target_commit == 'e993885c752e97532214ef14a2fcf32b324bc08c' || inputs.target_commit == 'bc8449887e6b88f11b05ccbed13613f2f34e9b57' || inputs.target_commit == 'd715770a7753ea70931b330ce297fd566af6f0dd')
        working-directory: source
        run: |
          node --test tests/mobile-calendar-layout.test.mjs
          node --test --test-name-pattern='compact phone calendar' tests/daily-todos-ui.test.mjs
      - name: Verify compact mobile article review
        if: inputs.run_regression_tests && (inputs.target_commit == 'b35dd510aec0fe67a88aa02edabcd73bfda9b33f' || inputs.target_commit == '5044ed66af80f9593879453d23c88c3851a06f12' || inputs.target_commit == '334e00d676452cc47e044cb4f88f8209b1c411b0' || inputs.target_commit == '52f5f32f29526b302e0f58bf3272f2d636f782a4' || inputs.target_commit == 'e993885c752e97532214ef14a2fcf32b324bc08c' || inputs.target_commit == 'bc8449887e6b88f11b05ccbed13613f2f34e9b57' || inputs.target_commit == 'd715770a7753ea70931b330ce297fd566af6f0dd')
        working-directory: source
        run: node --test tests/mobile-review-layout.test.mjs tests/mobile-review-collapse.test.mjs
      - name: Verify OpenAI review and backup contracts without provider calls
        if: inputs.run_regression_tests && (inputs.target_commit == '5044ed66af80f9593879453d23c88c3851a06f12' || inputs.target_commit == '334e00d676452cc47e044cb4f88f8209b1c411b0' || inputs.target_commit == '52f5f32f29526b302e0f58bf3272f2d636f782a4' || inputs.target_commit == 'e993885c752e97532214ef14a2fcf32b324bc08c' || inputs.target_commit == 'bc8449887e6b88f11b05ccbed13613f2f34e9b57' || inputs.target_commit == 'd715770a7753ea70931b330ce297fd566af6f0dd')
        working-directory: source
        run: node --test tests/openai-review.test.mjs tests/openai-review-ui.test.mjs tests/openai-review-migration-backup.test.mjs tests/openai-review-model-progress.test.mjs tests/openai-review-runtime.test.mjs
      - name: Verify read-only data trends and preserved diagnosis UI
        if: inputs.run_regression_tests && (inputs.target_commit == '334e00d676452cc47e044cb4f88f8209b1c411b0' || inputs.target_commit == '52f5f32f29526b302e0f58bf3272f2d636f782a4' || inputs.target_commit == 'e993885c752e97532214ef14a2fcf32b324bc08c' || inputs.target_commit == 'bc8449887e6b88f11b05ccbed13613f2f34e9b57' || inputs.target_commit == 'd715770a7753ea70931b330ce297fd566af6f0dd')
        working-directory: source
        run: |
          node --test tests/review-trends.test.mjs tests/review-analytics.test.mjs tests/content-review-data.test.mjs tests/content-review-ui.test.mjs tests/content-review-v121.test.mjs tests/content-review-v13.test.mjs tests/review-sections-current.test.mjs
          node --test tests/openai-review-connectivity.test.mjs tests/openai-review-observable-ui.test.mjs
          node scripts/verify-data-trends.mjs
      - name: Verify Claude public crawling policy and unchanged API authorization
        if: inputs.run_regression_tests && (inputs.target_commit == '52f5f32f29526b302e0f58bf3272f2d636f782a4' || inputs.target_commit == 'e993885c752e97532214ef14a2fcf32b324bc08c' || inputs.target_commit == 'bc8449887e6b88f11b05ccbed13613f2f34e9b57' || inputs.target_commit == 'd715770a7753ea70931b330ce297fd566af6f0dd')
        working-directory: source
        run: node --test tests/claude-robots.test.mjs tests/static-etags.test.mjs tests/public-business.test.mjs
      - name: Verify rules hierarchy and prompt version contracts
        if: inputs.run_regression_tests && (inputs.target_commit == 'd715770a7753ea70931b330ce297fd566af6f0dd')
        working-directory: source
        run: node --test --test-concurrency=1 tests/content-review*.test.mjs tests/review-*.test.mjs tests/mobile-review-*.test.mjs tests/claude-robots.test.mjs
      - name: Verify production release guards
        if: inputs.run_regression_tests
        run: node --test tests/cloudflare-production-restore.test.mjs tests/cloudflare-publish.test.mjs tests/cloudflare-data-trends-release.test.mjs tests/cloudflare-claude-robots-release.test.mjs tests/cloudflare-claude-trends-release.test.mjs tests/cloudflare-claude-notes-drafts-release.test.mjs tests/cloudflare-review-rules-release.test.mjs
      - name: Verify accepted Worker bytes
        run: node .github/scripts/release-policy.mjs artifact
      - name: Publish existing Worker with inherited bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          WORKER_PATH: source/dist/server/index.js
          EXPECTED_WORKER_SHA256: ${{ steps.release.outputs.worker_sha256 }}
          EXPECTED_WORKER_BYTES: ${{ steps.release.outputs.worker_bytes }}
        run: node .github/scripts/cloudflare-publish.mjs
