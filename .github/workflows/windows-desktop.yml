name: Windows desktop build and safety checks

on:
  workflow_dispatch:
  push:
    branches: ['desktop/**']
    paths: ['desktop/windows/**', '.github/workflows/windows-desktop.yml']

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: desktop/windows
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Use official pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.403'
      - name: Run synthetic tests and create portable Windows package
        id: portable
        run: ./scripts/package-windows.ps1
      - name: Build unsigned per-user MSI and verify on disposable hosted runner
        env:
          HDY_PUBLISH_ROOT: ${{ steps.portable.outputs.publish-root }}
          HDY_DELIVERY_ROOT: ${{ steps.portable.outputs.delivery-root }}
        run: ./scripts/package-installer.ps1 -PublishRoot $env:HDY_PUBLISH_ROOT -DeliveryRoot $env:HDY_DELIVERY_ROOT
      - name: Preserve package and exact-source evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-desktop-evidence-${{ github.sha }}
          path: desktop/windows/artifacts/**/delivery/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
