name: Review trends isolated browser acceptance
on:
  push:
    branches: ['opt/review-trends-browser-20261110']
permissions:
  contents: read
concurrency:
  group: review-trends-browser-acceptance
  cancel-in-progress: false
jobs:
  candidate-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_COMMIT: c46884162d55fe5c1ad244353e204345260846dd
      CANDIDATE_TREE: ec6e083eb75bb026536de9e506a61291ecf48781
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.BASE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Restore only pinned correction sources from public Git objects
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          python3 - <<'PY_SOURCE'
          import base64, hashlib, json, urllib.request
          from pathlib import Path
          entries = {
              '.ci/public-assets.json': '18465b0ccdb27e5aa7e3475fe511c42415cf5604',
              'docs/data-trends.md': 'b76b6901a5c1df2de55f9c38ecc42795bb805e3e',
              'public/index.html': '8009f22dc2819cb190e10750894581de5394a105',
              'public/review.css': '07a86f64243e2d83434482e95228a59b30287995',
              'public/sw.js': 'abaad32f25790c0ed6bf524fa590616151933688',
              'shared/review-analytics.mjs': 'faf7fb6b0e744048fa68fdcbcfc7574139ddeb22',
              'tests/browser-review-trends.py': '9f6c31d1a109d6cc8dd4c08a866c0a5b46a78e7a',
              'tests/review-trends-browser-server.mjs': 'c918607d46d2f07c37546aa70fd37e07b599c7ff',
              'tests/review-trends.test.mjs': 'de3a5c9e11a2ff81a5e9751a808b20f6519caaa0',
              'web/core/review-trends.mjs': '5e23b3b2450237aab046be0367e441a373493246',
              'web/pages/review-trends.mjs': '8f94f234f7a38b1f2ab7ba6887a205ff65e87ae4',
          }
          for path, sha in entries.items():
              url = f'https://api.github.com/repos/haohaoyu-AI/haoduoyu-web/git/blobs/{sha}'
              request = urllib.request.Request(url, headers={'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.geturl() == url, 'Unexpected redirect'
                  obj = json.load(response)
              assert obj['sha'] == sha and obj['encoding'] == 'base64'
              data = base64.b64decode(obj['content'])
              assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == sha
              Path(path).write_bytes(data)
          PY_SOURCE
      - name: Install locked product dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild exact candidate tree without publishing it
        run: |
          npm run build
          npm run check:artifacts
          node scripts/frontend-build.mjs --check
          test "$(git hash-object public/app.js)" = 'cc9b54ccd7f6d73a1e4a59b4cbd02549cd00ebc3'
          test "$(wc -c < dist/server/index.js | tr -d ' ')" = '2844076'
          echo 'f6ca099166856484fcff442aa56b5904cebb76b323b10978b8f38bc50fa56325  dist/server/index.js' | sha256sum -c -
          git add .ci/public-assets.json docs/data-trends.md public/app.js public/index.html public/review.css public/sw.js shared/review-analytics.mjs tests/browser-review-trends.py tests/review-trends-browser-server.mjs tests/review-trends.test.mjs web/core/review-trends.mjs web/pages/review-trends.mjs
          test "$(git write-tree)" = "$CANDIDATE_TREE"
          git diff --exit-code
          # No commit, push, upload of source bundles, or production credentials.
      - name: Run focused regressions without provider calls
        run: |
          node --test --test-concurrency=1 tests/review-*.test.mjs tests/content-review-*.test.mjs tests/openai-*.test.mjs
          node --test tests/deploy-review.test.mjs tests/cloudflare-publish.test.mjs
          node scripts/verify-data-trends.mjs
      - name: Install isolated official browser test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/trends-browser-venv"
          "$RUNNER_TEMP/trends-browser-venv/bin/python" -m pip install --disable-pip-version-check playwright==1.58.0
          "$RUNNER_TEMP/trends-browser-venv/bin/python" -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Test the synthetic local page at desktop and phone widths
        shell: bash
        run: |
          mkdir -p artifacts/data-trends
          trap 'kill "${SERVER_PID:-}" 2>/dev/null || true' EXIT
          for WIDTH in 1440 390 375; do
            LOG="artifacts/data-trends/browser-server-${WIDTH}.log"
            node tests/review-trends-browser-server.mjs > "$LOG" 2>&1 &
            SERVER_PID=$!
            READY=false
            for attempt in $(seq 1 60); do
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat "$LOG"; exit 1; fi
              if grep -q '^SYNTHETIC_TRENDS_READY ' "$LOG"; then READY=true; break; fi
              sleep 1
            done
            "$READY" || { cat "$LOG"; exit 1; }
            curl --fail --silent http://127.0.0.1:8921/ > /dev/null
            TRENDS_BROWSER_WIDTH="$WIDTH" "$RUNNER_TEMP/trends-browser-venv/bin/python" - <<'PY_BROWSER'
          from pathlib import Path
          test = Path('tests/browser-review-trends.py').resolve()
          source = test.read_text()
          # Use the official pinned Playwright browser, preserving every assertion.
          launch_path = "executable_path='/usr/bin/chromium',"
          assert source.count(launch_path) == 1
          source = source.replace(launch_path, '')
          exec(compile(source, str(test), 'exec'), {'__file__': str(test), '__name__': '__main__'})
          PY_BROWSER
            mv artifacts/data-trends/browser-report.json "artifacts/data-trends/browser-report-${WIDTH}.json"
            kill "$SERVER_PID"
            wait "$SERVER_PID" || true
            SERVER_PID=''
          done
          python3 - <<'PY_REPORT'
          import json
          from pathlib import Path
          out = Path('artifacts/data-trends')
          reports = [json.loads((out/f'browser-report-{width}.json').read_text()) for width in [1440,390,375]]
          assert all(report['status'] == 'passed' for report in reports)
          result = {'synthetic': True, 'status': 'passed', 'isolated_runtime_per_viewport': True,
                    'service_workers': reports[0]['service_workers']}
          for key in ['checks','screenshots','writes','page_errors','http_errors','readability']:
              result[key] = [item for report in reports for item in report[key]]
          assert [check['width'] for check in result['checks']] == [1440,390,375]
          (out/'browser-report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY_REPORT
      - name: Save synthetic screenshots and test reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-trends-browser-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/data-trends/trends-*.png
            artifacts/data-trends/browser-report*.json
            artifacts/data-trends/browser-server*.log
            artifacts/data-trends/inputs-expected-actual.json
