name: Review trends isolated browser acceptance
on:
  push:
    branches: ['opt/review-trends-browser-20261110']
permissions:
  contents: read
concurrency:
  group: review-trends-browser-acceptance
  cancel-in-progress: false
jobs:
  candidate-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_COMMIT: c46884162d55fe5c1ad244353e204345260846dd
      CANDIDATE_TREE: 561ff79578904620c1f4914a9e8ec418704303e9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.BASE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Restore only pinned correction sources from public Git objects
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          python3 - <<'PY_SOURCE'
          import base64, hashlib, json, urllib.request
          from pathlib import Path
          entries = {
              '.ci/public-assets.json': '5fed4ccf2aebe4872771b76ced1dd5a2f5c03d11',
              'docs/data-trends.md': '4ea29efdf3977bbdb7131603824565584c35500f',
              'public/index.html': 'eb868901dd414a8566bae032fc9fbe382889fdab',
              'public/sw.js': '2dd87adbf9554c7acb5943410b8e6f3ad4a3cd49',
              'shared/review-analytics.mjs': 'faf7fb6b0e744048fa68fdcbcfc7574139ddeb22',
              'tests/review-trends.test.mjs': 'c006211b9bdfe90d059ad9df1ee57c748ab8266a',
              'web/core/review-trends.mjs': '5e23b3b2450237aab046be0367e441a373493246',
              'web/pages/review-trends.mjs': '37076598d92a8d46c7941422bd30849007fcdb4d',
              'tests/review-trends-browser-server.mjs': 'c918607d46d2f07c37546aa70fd37e07b599c7ff',
          }
          for path, sha in entries.items():
              url = f'https://api.github.com/repos/haohaoyu-AI/haoduoyu-web/git/blobs/{sha}'
              request = urllib.request.Request(url, headers={'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.geturl() == url, 'Unexpected redirect'
                  obj = json.load(response)
              assert obj['sha'] == sha and obj['encoding'] == 'base64'
              data = base64.b64decode(obj['content'])
              assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == sha
              Path(path).write_bytes(data)
          PY_SOURCE
      - name: Install locked product dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild exact candidate tree without publishing it
        run: |
          npm run build
          npm run check:artifacts
          node scripts/frontend-build.mjs --check
          test "$(git hash-object public/app.js)" = '49b76098a2f0904220322cff089fa045f2792d88'
          test "$(wc -c < dist/server/index.js | tr -d ' ')" = '2843919'
          echo 'eac54af8bacb4cba2f88ab35db249c281b62d4997214bf65c6c1b17155c8c851  dist/server/index.js' | sha256sum -c -
          git add .ci/public-assets.json docs/data-trends.md public/app.js public/index.html public/sw.js shared/review-analytics.mjs tests/review-trends.test.mjs web/core/review-trends.mjs web/pages/review-trends.mjs tests/review-trends-browser-server.mjs
          test "$(git write-tree)" = "$CANDIDATE_TREE"
          git diff --exit-code
          # No commit, push, upload of source bundles, or production credentials.
      - name: Run focused regressions without provider calls
        run: |
          node --test --test-concurrency=1 tests/review-*.test.mjs tests/content-review-*.test.mjs tests/openai-*.test.mjs
          node --test tests/deploy-review.test.mjs tests/cloudflare-publish.test.mjs
          node scripts/verify-data-trends.mjs
      - name: Install isolated official browser test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/trends-browser-venv"
          "$RUNNER_TEMP/trends-browser-venv/bin/python" -m pip install --disable-pip-version-check playwright==1.58.0
          "$RUNNER_TEMP/trends-browser-venv/bin/python" -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Test the synthetic local page at desktop and phone widths
        shell: bash
        run: |
          mkdir -p artifacts/data-trends
          node tests/review-trends-browser-server.mjs > artifacts/data-trends/browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8921/ > /dev/null; then break; fi
            sleep 1
          done
          "$RUNNER_TEMP/trends-browser-venv/bin/python" - <<'PY'
          from pathlib import Path
          test = Path('tests/browser-review-trends.py').resolve()
          source = test.read_text()
          # The runner uses Playwright's pinned Chromium instead of a distro path.
          # Keep the candidate file and every test assertion unchanged on disk.
          launch_path = "executable_path='/usr/bin/chromium',"
          assert source.count(launch_path) == 1
          source = source.replace(launch_path, '')
          initial = "        expect(page.locator('.review-trends')).to_be_visible(timeout=20000)"
          diagnostic = '\n'.join([
              '        try:', '    ' + initial,
              '        except Exception:',
              "            page.screenshot(path=str(OUT/f'trends-initial-error-{width}.png'),full_page=True)",
              "            print('SYNTHETIC_PAGE_URL',page.url)",
              "            print('SYNTHETIC_PAGE_TEXT',page.locator('body').inner_text())",
              "            print('SYNTHETIC_PAGE_ERRORS',report['page_errors'])",
              '            raise',
          ])
          assert initial in source
          source = source.replace(initial, diagnostic, 1)
          exec(compile(source, str(test), 'exec'), {'__file__': str(test), '__name__': '__main__'})
          PY
      - name: Save synthetic screenshots and test reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-trends-browser-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/data-trends/trends-*.png
            artifacts/data-trends/browser-report.json
            artifacts/data-trends/browser-server.log
            artifacts/data-trends/inputs-expected-actual.json
