name: Pinned full-history secret scan
description: Scan all fetched Git history with checksum-verified official Gitleaks.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        set -euo pipefail
        task_dir=$(mktemp -d "${RUNNER_TEMP}/gitleaks.XXXXXX")
        trap 'rm -rf "$task_dir"' EXIT
        archive="${task_dir}/gitleaks.tar.gz"
        curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          --output "$archive"
        printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
        tar -xzf "$archive" -C "$task_dir" gitleaks
        "${task_dir}/gitleaks" git . --log-opts='--all --full-history -m --root' \
          --config .gitleaks.toml --redact=100 --ignore-gitleaks-allow --gitleaks-ignore-path .gitleaksignore --no-banner
