services:
  matrix:
    build: .
    restart: unless-stopped
    environment:
      SITE_ORIGIN: ${SITE_ORIGIN:?Set SITE_ORIGIN to your HTTPS origin}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - matrix-data:/app/data
      - matrix-backups:/app/backups
volumes:
  matrix-data:
  matrix-backups:
