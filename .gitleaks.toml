title = "Default rules with three reviewed daily-todo checksum exceptions"

[extend]
useDefault = true

# User-approved on 2026-10-23; independently recomputed from public Git blobs.
# Both the exact path and one exact checksum must match; all other rules remain.
[[allowlists]]
description = "Three public-file checksums in the frozen daily-todo evidence"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^docs/daily-todos-evidence\.json$''']
