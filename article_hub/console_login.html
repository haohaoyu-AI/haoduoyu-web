<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · 好多鱼图文</title>
  <style>
    :root{color-scheme:light;font-family:"Microsoft YaHei",sans-serif;color:#20252b;background:#f4f6f8}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(100%,390px);background:#fff;border:1px solid #e2e6ea;border-radius:12px;padding:30px;box-shadow:0 12px 40px #26344512}
    h1{font-size:22px;margin:0 0 8px}p{font-size:13px;line-height:1.7;color:#58616a;margin:0 0 20px;overflow-wrap:anywhere}
    label{display:block;font-size:13px;margin:14px 0 6px}input{width:100%;padding:11px 12px;border:1px solid #ccd3da;border-radius:7px;font:inherit}
    button{width:100%;margin-top:20px;padding:11px;border:0;border-radius:7px;background:#20252b;color:#fff;font:inherit;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}#message{min-height:1.5em;margin:12px 0 0;color:#8a3b26}
  </style>
</head>
<body>
  <main>
    <h1>登录好多鱼图文</h1>
    <p id="setup-status">__HAODUOYU_LOGIN_STATUS__</p>
    <form id="login-form" autocomplete="on">
      <label for="username">本地账号</label>
      <input id="username" name="username" autocomplete="username" maxlength="64" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
      <button id="submit" type="submit">登录</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById('login-form');
    const button = document.getElementById('submit');
    const message = document.getElementById('message');
    const configured = !document.getElementById('setup-status').textContent.includes('尚未配置');
    if (!configured) { button.disabled = true; }
    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      button.disabled = true;
      message.textContent = '';
      try {
        const response = await fetch('/api/login', {
          method: 'POST', credentials: 'same-origin', cache: 'no-store',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const result = await response.json();
        if (!response.ok) { throw new Error(result.error || '登录失败'); }
        document.getElementById('password').value = '';
        window.location.replace('/');
      } catch (error) {
        message.textContent = error.message || '登录失败，请重试。';
        button.disabled = !configured;
      }
    });
  </script>
</body>
</html>
